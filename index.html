<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上時鐘 & 多功能計時工具</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --subtext-color: #94a3b8;
            --danger-color: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .clock-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 10px 0;
        }

        .sub-text {
            color: var(--subtext-color);
            font-size: 0.9rem;
        }

        .input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        input, button {
            padding: 10px 15px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 1rem;
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button.stop-btn {
            background-color: var(--danger-color);
            color: white;
        }

        .timer-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2rem;
            margin: 10px 0;
        }

        /* 碼表計圈清單樣式 */
        .lap-list {
            max-height: 180px;
            overflow-y: auto;
            margin-top: 10px;
            padding: 0;
            list-style: none;
            border-top: 1px solid #334155;
        }

        .lap-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            font-family: 'Courier New', Courier, monospace;
            border-bottom: 1px solid #334155;
            font-size: 0.85rem;
            color: var(--subtext-color);
        }

        .lap-details {
            text-align: right;
        }

        .lap-time-split {
            color: var(--accent-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>臺灣標準時間多功能時鐘</h1>

    <div class="container">
        <!-- 當前時間 (精確至毫秒，24小時制) -->
        <div class="card">
            <div class="sub-text">臺灣標準時間 (UTC+8)</div>
            <div id="clock" class="clock-display">00:00:00.000</div>
            <div id="date" class="sub-text">YYYY-MM-DD</div>
        </div>

        <!-- 鬧鐘功能 (24小時制) -->
        <div class="card">
            <h2>鬧鐘 (Alarm - 24小時制)</h2>
            <div class="input-group">
                <input type="time" id="alarmTime" step="1">
                <button id="setAlarmBtn">設定鬧鐘</button>
            </div>
            <div id="alarmStatus" class="sub-text">未設定鬧鐘</div>
        </div>

        <!-- 倒數計時功能 -->
        <div class="card">
            <h2>倒數計時器 (Countdown)</h2>
            <div class="input-group">
                <input type="number" id="cdMinutes" placeholder="分" min="0" style="width: 70px;">
                <input type="number" id="cdSeconds" placeholder="秒" min="0" max="59" style="width: 70px;">
                <button id="startCdBtn">開始倒數</button>
            </div>
            <div id="countdownDisplay" class="timer-display">00:00.000</div>
        </div>

        <!-- 碼表功能 -->
        <div class="card">
            <h2>碼表 (Stopwatch)</h2>
            <div id="stopwatchDisplay" class="timer-display">00:00:00.000</div>
            <div class="input-group">
                <button id="swStartBtn">開始</button>
                <button id="swLapBtn" disabled>計圈</button>
                <button id="swResetBtn" disabled>重設</button>
            </div>
            <ul id="swLapList" class="lap-list"></ul>
        </div>
    </div>

    <script>
        // --- 1. 精確時鐘 (毫秒 + 強制 24 小時制) ---
        function updateClock() {
            const now = new Date();
            
            // 使用 Intl API 並明確設定 hourCycle: 'h23' 以確保絕對使用 24 小時制 (00-23)
            const options = { 
                timeZone: 'Asia/Taipei', 
                hourCycle: 'h23',
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            };
            const timeParts = new Intl.DateTimeFormat('zh-TW', options).formatToParts(now);
            
            let hours = '', minutes = '', seconds = '';
            timeParts.forEach(part => {
                if (part.type === 'hour') hours = part.value;
                if (part.type === 'minute') minutes = part.value;
                if (part.type === 'second') seconds = part.value;
            });

            // 取得毫秒（補足三位數）
            const milliseconds = String(now.getMilliseconds()).padStart(3, '0');
            
            // 顯示時間
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}.${milliseconds}`;

            // 顯示日期
            const dateOptions = { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'long' };
            document.getElementById('date').textContent = new Intl.DateTimeFormat('zh-TW', dateOptions).format(now);

            // 檢查鬧鐘
            checkAlarm(hours, minutes, seconds);

            // 透過 requestAnimationFrame 達到毫秒級更新
            requestAnimationFrame(updateClock);
        }

        // --- 2. 鬧鐘功能 (24小時制格式判斷) ---
        let alarmTarget = null;
        let alarmTriggered = false;

        document.getElementById('setAlarmBtn').addEventListener('click', () => {
            const alarmInput = document.getElementById('alarmTime').value;
            if (!alarmInput) {
                alert('請選擇鬧鐘時間！');
                return;
            }

            const parts = alarmInput.split(':');
            const h = parts[0].padStart(2, '0');
            const m = parts[1].padStart(2, '0');
            const s = parts[2] ? parts[2].padStart(2, '0') : '00';

            alarmTarget = `${h}:${m}:${s}`;
            alarmTriggered = false;
            document.getElementById('alarmStatus').textContent = `鬧鐘已設定為（24小時制）：${alarmTarget}`;
        });

        function checkAlarm(h, m, s) {
            if (!alarmTarget || alarmTriggered) return;
            const currentFormatted = `${h}:${m}:${s}`;
            
            if (currentFormatted === alarmTarget) {
                alarmTriggered = true;
                playAudioAlert();
                alert(`⏰ 鬧鐘響起！時間是 ${alarmTarget}`);
                document.getElementById('alarmStatus').textContent = '鬧鐘已響起';
            }
        }

        // --- 3. 倒數計時功能 ---
        let countdownInterval = null;
        let countdownEndTime = null;

        document.getElementById('startCdBtn').addEventListener('click', function() {
            const btn = this;
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
                document.getElementById('countdownDisplay').textContent = '00:00.000';
                btn.textContent = '開始倒數';
                btn.classList.remove('stop-btn');
                return;
            }

            const mins = parseInt(document.getElementById('cdMinutes').value) || 0;
            const secs = parseInt(document.getElementById('cdSeconds').value) || 0;
            const totalMs = (mins * 60 + secs) * 1000;

            if (totalMs <= 0) {
                alert('請輸入有效的倒數時間！');
                return;
            }

            countdownEndTime = Date.now() + totalMs;
            btn.textContent = '停止倒數';
            btn.classList.add('stop-btn');

            countdownInterval = setInterval(() => {
                const remaining = countdownEndTime - Date.now();

                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    document.getElementById('countdownDisplay').textContent = '00:00.000';
                    btn.textContent = '開始倒數';
                    btn.classList.remove('stop-btn');
                    playAudioAlert();
                    alert('⏱️ 倒數計時結束！');
                    return;
                }

                const rMin = String(Math.floor(remaining / 60000)).padStart(2, '0');
                const rSec = String(Math.floor((remaining % 60000) / 1000)).padStart(2, '0');
                const rMs = String(remaining % 1000).padStart(3, '0');

                document.getElementById('countdownDisplay').textContent = `${rMin}:${rSec}.${rMs}`;
            }, 10);
        });

        // --- 4. 碼表功能 (包含總時間與分圈時間計算) ---
        let swStartTime = 0;
        let swElapsedTime = 0;
        let swLastLapTime = 0; // 紀錄上一次計圈的時間點
        let swTimerInterval = null;
        let swLapCount = 0;

        const swDisplay = document.getElementById('stopwatchDisplay');
        const swStartBtn = document.getElementById('swStartBtn');
        const swLapBtn = document.getElementById('swLapBtn');
        const swResetBtn = document.getElementById('swResetBtn');
        const swLapList = document.getElementById('swLapList');

        function formatStopwatchTime(ms) {
            const hrs = String(Math.floor(ms / 3600000)).padStart(2, '0');
            const mins = String(Math.floor((ms % 3600000) / 60000)).padStart(2, '0');
            const secs = String(Math.floor((ms % 60000) / 1000)).padStart(2, '0');
            const millis = String(ms % 1000).padStart(3, '0');
            return `${hrs}:${mins}:${secs}.${millis}`;
        }

        swStartBtn.addEventListener('click', () => {
            if (swTimerInterval) {
                // 暫停
                clearInterval(swTimerInterval);
                swTimerInterval = null;
                swStartBtn.textContent = '開始';
                swStartBtn.classList.remove('stop-btn');
                swLapBtn.disabled = true;
            } else {
                // 開始 / 繼續
                swStartTime = Date.now() - swElapsedTime;
                swTimerInterval = setInterval(() => {
                    swElapsedTime = Date.now() - swStartTime;
                    swDisplay.textContent = formatStopwatchTime(swElapsedTime);
                }, 10);
                swStartBtn.textContent = '暫停';
                swStartBtn.classList.add('stop-btn');
                swLapBtn.disabled = false;
                swResetBtn.disabled = false;
            }
        });

        swLapBtn.addEventListener('click', () => {
            if (!swTimerInterval) return;
            swLapCount++;
            
            // 計算距離上一次計圈的時間差
            const lapSplitTime = swElapsedTime - swLastLapTime;
            swLastLapTime = swElapsedTime; // 更新上一次計圈時間

            const li = document.createElement('li');
            li.className = 'lap-item';
            li.innerHTML = `
                <span>圈數 ${swLapCount}</span>
                <div class="lap-details">
                    <span class="lap-time-split">+${formatStopwatchTime(lapSplitTime)}</span>
                    <br>
                    <span>總時間: ${formatStopwatchTime(swElapsedTime)}</span>
                </div>
            `;
            swLapList.prepend(li);
        });

        swResetBtn.addEventListener('click', () => {
            clearInterval(swTimerInterval);
            swTimerInterval = null;
            swElapsedTime = 0;
            swLastLapTime = 0;
            swLapCount = 0;
            swDisplay.textContent = '00:00:00.000';
            swStartBtn.textContent = '開始';
            swStartBtn.classList.remove('stop-btn');
            swLapBtn.disabled = true;
            swResetBtn.disabled = true;
            swLapList.innerHTML = '';
        });

        // --- 5. 簡易提示音 ---
        function playAudioAlert() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 1.5);
            } catch (e) {
                console.log('無法播放音效:', e);
            }
        }

        // 啟動主時鐘
        requestAnimationFrame(updateClock);
    </script>
</body>
</html>
