<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大海專屬時鐘</title>
    <link rel="icon" href="https://www.pinterest.com/pin/620863498620754160/">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --subtext-color: #94a3b8;
            --danger-color: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .clock-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 10px 0;
        }

        .sub-text {
            color: var(--subtext-color);
            font-size: 0.9rem;
        }

        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        input, select, button {
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 1rem;
        }

        select {
            cursor: pointer;
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button.stop-btn {
            background-color: var(--danger-color);
            color: white;
        }

        .timer-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2rem;
            margin: 10px 0;
        }

        /* 鬧鐘與碼表清單樣式 */
        .item-list {
            max-height: 180px;
            overflow-y: auto;
            margin-top: 10px;
            padding: 0;
            list-style: none;
            border-top: 1px solid #334155;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            font-family: 'Courier New', Courier, monospace;
            border-bottom: 1px solid #334155;
            font-size: 0.9rem;
            color: var(--subtext-color);
        }

        .delete-btn {
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 4px 8px;
            font-size: 0.8rem;
            border-radius: 4px;
        }

        .delete-btn:hover {
            background-color: var(--danger-color);
            color: white;
        }

        .lap-details {
            text-align: right;
        }

        .lap-time-split {
            color: var(--accent-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>臺灣標準時間多功能時鐘</h1>

    <div class="container">
        <!-- 當前時間 (精確至毫秒，24小時制) -->
        <div class="card">
            <div class="sub-text">臺灣標準時間 (UTC+8)</div>
            <div id="clock" class="clock-display">00:00:00.000</div>
            <div id="date" class="sub-text">YYYY-MM-DD</div>
        </div>

        <!-- 鬧鐘功能 -->
        <div class="card">
            <h2>鬧鐘</h2>
            <div class="input-group">
                <select id="alarmHour"></select> 時
                <select id="alarmMinute"></select> 分
                <select id="alarmSecond"></select> 秒
                <button id="setAlarmBtn">新增鬧鐘</button>
            </div>
            <ul id="alarmList" class="item-list"></ul>
        </div>

        <!-- 倒數計時功能 -->
        <div class="card">
            <h2>倒數計時器</h2>
            <div class="input-group">
                <input type="number" id="cdMinutes" placeholder="分" min="0" style="width: 70px;">
                <input type="number" id="cdSeconds" placeholder="秒" min="0" max="59" style="width: 70px;">
                <button id="startCdBtn">開始倒數</button>
            </div>
            <div id="countdownDisplay" class="timer-display">00:00.000</div>
        </div>

        <!-- 碼表功能 -->
        <div class="card">
            <h2>碼表</h2>
            <div id="stopwatchDisplay" class="timer-display">00:00:00.000</div>
            <div class="input-group">
                <button id="swStartBtn">開始</button>
                <button id="swLapBtn" disabled>計圈</button>
                <button id="swResetBtn" disabled>重設</button>
            </div>
            <ul id="swLapList" class="item-list"></ul>
        </div>
    </div>
