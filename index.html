<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大海專屬時鐘</title>
    
    <!-- iOS / iPadOS Safari 加入主畫面專用圖示 (需在同資料夾放置 icon.png) -->
    <link id="appleIcon" rel="apple-touch-icon" sizes="180x180" href="icon.png">
    <!-- Android / Chrome / 一般瀏覽器分頁圖示 -->
    <link id="favicon" rel="icon" type="image/png" href="icon.png">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --subtext-color: #94a3b8;
            --danger-color: #ef4444;
            --success-color: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .audio-notice {
            font-size: 0.85rem;
            color: var(--subtext-color);
            margin-bottom: 15px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .clock-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 10px 0;
        }

        .sub-text {
            color: var(--subtext-color);
            font-size: 0.9rem;
        }

        .input-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        input, select, button {
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 1rem;
        }

        select {
            cursor: pointer;
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button.stop-btn {
            background-color: var(--danger-color);
            color: white;
        }

        .clear-btn {
            background-color: transparent;
            color: var(--subtext-color);
            border: 1px solid #334155;
        }

        .clear-btn:hover {
            background-color: #334155;
            color: var(--text-color);
        }

        .timer-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2rem;
            margin: 10px 0;
        }

        /* 清單樣式 */
        .item-list {
            max-height: 220px;
            overflow-y: auto;
            margin-top: 10px;
            padding: 0;
            list-style: none;
            border-top: 1px solid #334155;
        }

        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            font-family: 'Courier New', Courier, monospace;
            border-bottom: 1px solid #334155;
            font-size: 0.9rem;
            color: var(--subtext-color);
        }

        .delete-btn {
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 4px 8px;
            font-size: 0.8rem;
            border-radius: 4px;
        }

        .delete-btn:hover {
            background-color: var(--danger-color);
            color: white;
        }

        .lap-details {
            text-align: right;
        }

        .lap-time-split {
            color: var(--accent-color);
            font-weight: bold;
        }

        /* 自訂提醒彈出視窗 (Modal) 樣式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background-color: var(--card-bg);
            border: 2px solid var(--accent-color);
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            max-width: 80%;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-box h3 {
            margin-top: 0;
            color: var(--accent-color);
            font-size: 1.5rem;
        }

        .modal-box p {
            font-size: 1.2rem;
            margin: 20px 0;
        }

        .modal-box button {
            background-color: var(--danger-color);
            color: white;
            padding: 12px 24px;
            font-size: 1.1rem;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>臺灣標準時間多功能時鐘</h1>
    <div class="audio-notice">💡 提示：點擊頁面任意按鈕可自動啟用手機蜂鳴器權限</div>

    <div class="container">
        <!-- 當前時間 (精確至毫秒，24小時制) -->
        <div class="card">
            <div class="sub-text">臺灣標準時間 (UTC+8)</div>
            <div id="clock" class="clock-display">00:00:00.000</div>
            <div id="date" class="sub-text">YYYY-MM-DD</div>
        </div>

        <!-- 鬧鐘功能 -->
        <div class="card">
            <h2>鬧鐘</h2>
            <div class="input-group">
                <select id="alarmHour"></select> 時
                <select id="alarmMinute"></select> 分
                <select id="alarmSecond"></select> 秒
                <button id="setAlarmBtn">新增鬧鐘</button>
                <button id="clearAlarmInputBtn" class="clear-btn">清除所有</button>
            </div>
            <ul id="alarmList" class="item-list"></ul>
        </div>

        <!-- 倒數計時功能 -->
        <div class="card">
            <h2>倒數計時器</h2>
            <div class="input-group">
                <input type="number" id="cdMinutes" placeholder="分" min="0" style="width: 70px;">
                <input type="number" id="cdSeconds" placeholder="秒" min="0" max="59" style="width: 70px;">
                <button id="startCdBtn">開始倒數</button>
                <button id="clearCdInputBtn" class="clear-btn">清除所有</button>
            </div>
            <div id="countdownDisplay" class="timer-display">00:00.000</div>
        </div>

        <!-- 碼表功能 -->
        <div class="card">
            <h2>碼表</h2>
            <div id="stopwatchDisplay" class="timer-display">00:00:00.000</div>
            <div class="input-group">
                <button id="swStartBtn">開始</button>
                <button id="swLapBtn" disabled>計圈</button>
                <button id="swResetBtn" disabled>重設</button>
            </div>
            <ul id="swLapList" class="item-list"></ul>
        </div>
    </div>

    <!-- 自訂提醒 Modal -->
    <div id="alertModal" class="modal-overlay">
        <div class="modal-box">
            <h3>⏰ 時間到！</h3>
            <p id="modalMessage">時間到了！</p>
            <button id="modalCloseBtn">確定關閉</button>
        </div>
    </div>

    <script>
        // --- 0. 自動將 icon.png 裁切轉換為圓形圖示 ---
        function makeFaviconCircle() {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = 'icon.png';
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const size = Math.min(img.width, img.height);
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                ctx.beginPath();
                ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2, true);
                ctx.closePath();
                ctx.clip();

                ctx.drawImage(img, 0, 0, size, size);

                const circularDataUrl = canvas.toDataURL('image/png');
                document.getElementById('favicon').href = circularDataUrl;
            };
        }
        makeFaviconCircle();

        // --- 全域 AudioContext (解決手機主畫面自動播放限制) ---
        let globalAudioCtx = null;

        function initAudioContext() {
            if (!globalAudioCtx) {
                globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (globalAudioCtx.state === 'suspended') {
                globalAudioCtx.resume();
            }
        }

        // 監聽第一次使用者點擊動作以解鎖音效
        document.addEventListener('click', initAudioContext, { once: false });

        // --- 1. 精確時鐘 (毫秒 + 強制 24 小時制) ---
        function updateClock() {
            const now = new Date();
            
            const options = { 
                timeZone: 'Asia/Taipei', 
                hourCycle: 'h23',
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit' 
            };
            const timeParts = new Intl.DateTimeFormat('zh-TW', options).formatToParts(now);
            
            let hours = '', minutes = '', seconds = '';
            timeParts.forEach(part => {
                if (part.type === 'hour') hours = part.value;
                if (part.type === 'minute') minutes = part.value;
                if (part.type === 'second') seconds = part.value;
            });

            const milliseconds = String(now.getMilliseconds()).padStart(3, '0');
            
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}.${milliseconds}`;

            const dateOptions = { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'long' };
            document.getElementById('date').textContent = new Intl.DateTimeFormat('zh-TW', dateOptions).format(now);

            checkAlarms(hours, minutes, seconds);

            requestAnimationFrame(updateClock);
        }

        // --- 2. 多組鬧鐘功能 ---
        const alarmHourSelect = document.getElementById('alarmHour');
        const alarmMinuteSelect = document.getElementById('alarmMinute');
        const alarmSecondSelect = document.getElementById('alarmSecond');
        const alarmListEl = document.getElementById('alarmList');

        for (let i = 0; i < 24; i++) {
            const val = String(i).padStart(2, '0');
            alarmHourSelect.add(new Option(val, val));
        }
        for (let i = 0; i < 60; i++) {
            const val = String(i).padStart(2, '0');
            alarmMinuteSelect.add(new Option(val, val));
            alarmSecondSelect.add(new Option(val, val));
        }

        let alarms = [];

        document.getElementById('setAlarmBtn').addEventListener('click', () => {
            initAudioContext(); // 點擊時啟用音效
            const h = alarmHourSelect.value;
            const m = alarmMinuteSelect.value;
            const s = alarmSecondSelect.value;
            const targetTime = `${h}:${m}:${s}`;

            if (alarms.some(a => a.time === targetTime)) {
                alert(`已存在 ${targetTime} 的鬧鐘！`);
                return;
            }

            const alarmObj = {
                id: Date.now(),
                time: targetTime,
                triggered: false
            };

            alarms.push(alarmObj);
            renderAlarmList();
        });

        document.getElementById('clearAlarmInputBtn').addEventListener('click', () => {
            alarmHourSelect.selectedIndex = 0;
            alarmMinuteSelect.selectedIndex = 0;
            alarmSecondSelect.selectedIndex = 0;
        });

        function renderAlarmList() {
            alarmListEl.innerHTML = '';
            alarms.sort((a, b) => a.time.localeCompare(b.time));

            alarms.forEach(alarm => {
                const li = document.createElement('li');
                li.className = 'list-item';
                li.innerHTML = `
                    <span>⏰ ${alarm.time} ${alarm.triggered ? '<small style="color:var(--danger-color)">(已響起)</small>' : ''}</span>
                    <button class="delete-btn" onclick="removeAlarm(${alarm.id})">刪除</button>
                `;
                alarmListEl.appendChild(li);
            });
        }

        function removeAlarm(id) {
            alarms = alarms.filter(a => a.id !== id);
            renderAlarmList();
        }

        function checkAlarms(h, m, s) {
            const currentFormatted = `${h}:${m}:${s}`;

            alarms.forEach(alarm => {
                if (!alarm.triggered && alarm.time === currentFormatted) {
                    alarm.triggered = true;
                    renderAlarmList();
                    showModalAlert(`⏰ 鬧鐘響起！時間是 ${alarm.time}`);
                }
            });
        }

        // --- 3. 倒數計時功能 ---
        let countdownInterval = null;
        let countdownEndTime = null;
        const cdMinutesInput = document.getElementById('cdMinutes');
        const cdSecondsInput = document.getElementById('cdSeconds');

        document.getElementById('startCdBtn').addEventListener('click', function() {
            initAudioContext(); // 點擊時啟用音效
            const btn = this;
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
                document.getElementById('countdownDisplay').textContent = '00:00.000';
                btn.textContent = '開始倒數';
                btn.classList.remove('stop-btn');
                return;
            }

            const mins = parseInt(cdMinutesInput.value) || 0;
            const secs = parseInt(cdSecondsInput.value) || 0;
            const totalMs = (mins * 60 + secs) * 1000;

            if (totalMs <= 0) {
                alert('請輸入有效的倒數時間！');
                return;
            }

            countdownEndTime = Date.now() + totalMs;
            btn.textContent = '開始倒數';
            btn.classList.add('stop-btn');

            countdownInterval = setInterval(() => {
                const remaining = countdownEndTime - Date.now();

                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    document.getElementById('countdownDisplay').textContent = '00:00.000';
                    btn.textContent = '開始倒數';
                    btn.classList.remove('stop-btn');
                    showModalAlert('⏱️ 倒數計時結束！');
                    return;
                }

                const rMin = String(Math.floor(remaining / 60000)).padStart(2, '0');
                const rSec = String(Math.floor((remaining % 60000) / 1000)).padStart(2, '0');
                const rMs = String(remaining % 1000).padStart(3, '0');

                document.getElementById('countdownDisplay').textContent = `${rMin}:${rSec}.${rMs}`;
            }, 10);
        });

        document.getElementById('clearCdInputBtn').addEventListener('click', () => {
            cdMinutesInput.value = '';
            cdSecondsInput.value = '';
        });

        // --- 4. 碼表功能 ---
        let swStartTime = 0;
        let swElapsedTime = 0;
        let swLastLapTime = 0;
        let swTimerInterval = null;
        let swLapCount = 0;
        let currentLapSplitSpan = null;
        let currentLapTotalSpan = null;

        const swDisplay = document.getElementById('stopwatchDisplay');
        const swStartBtn = document.getElementById('swStartBtn');
        const swLapBtn = document.getElementById('swLapBtn');
        const swResetBtn = document.getElementById('swResetBtn');
        const swLapList = document.getElementById('swLapList');

        function formatStopwatchTime(ms) {
            const hrs = String(Math.floor(ms / 3600000)).padStart(2, '0');
            const mins = String(Math.floor((ms % 3600000) / 60000)).padStart(2, '0');
            const secs = String(Math.floor((ms % 60000) / 1000)).padStart(2, '0');
            const millis = String(ms % 1000).padStart(3, '0');
            return `${hrs}:${mins}:${secs}.${millis}`;
        }

        function createNewLapItem(lapNum) {
            const li = document.createElement('li');
            li.className = 'list-item';
            
            const lapTitle = document.createElement('span');
            lapTitle.textContent = `圈數 ${lapNum}`;

            const detailsDiv = document.createElement('div');
            detailsDiv.className = 'lap-details';

            const splitSpan = document.createElement('span');
            splitSpan.className = 'lap-time-split';
            splitSpan.textContent = '+00:00:00.000';

            const br = document.createElement('br');

            const totalSpan = document.createElement('span');
            totalSpan.textContent = '總時間: 00:00:00.000';

            detailsDiv.appendChild(splitSpan);
            detailsDiv.appendChild(br);
            detailsDiv.appendChild(totalSpan);

            li.appendChild(lapTitle);
            li.appendChild(detailsDiv);

            swLapList.prepend(li);

            currentLapSplitSpan = splitSpan;
            currentLapTotalSpan = totalSpan;
        }

        swStartBtn.addEventListener('click', () => {
            initAudioContext();
            if (swTimerInterval) {
                clearInterval(swTimerInterval);
                swTimerInterval = null;
                swStartBtn.textContent = '開始';
                swStartBtn.classList.remove('stop-btn');
                swLapBtn.disabled = true;
            } else {
                swStartTime = Date.now() - swElapsedTime;
                
                if (swLapCount === 0) {
                    swLapCount = 1;
                    swLastLapTime = 0;
                    createNewLapItem(swLapCount);
                }

                swTimerInterval = setInterval(() => {
                    swElapsedTime = Date.now() - swStartTime;
                    
                    const formattedTotal = formatStopwatchTime(swElapsedTime);
                    const currentSplit = swElapsedTime - swLastLapTime;
                    const formattedSplit = formatStopwatchTime(currentSplit);

                    swDisplay.textContent = formattedTotal;

                    if (currentLapSplitSpan && currentLapTotalSpan) {
                        currentLapSplitSpan.textContent = `+${formattedSplit}`;
                        currentLapTotalSpan.textContent = `總時間: ${formattedTotal}`;
                    }
                }, 10);

                swStartBtn.textContent = '暫停';
                swStartBtn.classList.add('stop-btn');
                swLapBtn.disabled = false;
                swResetBtn.disabled = false;
            }
        });

        swLapBtn.addEventListener('click', () => {
            if (!swTimerInterval) return;
            
            swLastLapTime = swElapsedTime;
            swLapCount++;
            createNewLapItem(swLapCount);
        });

        swResetBtn.addEventListener('click', () => {
            clearInterval(swTimerInterval);
            swTimerInterval = null;
            swElapsedTime = 0;
            swLastLapTime = 0;
            swLapCount = 0;
            currentLapSplitSpan = null;
            currentLapTotalSpan = null;
            
            swDisplay.textContent = '00:00:00.000';
            swStartBtn.textContent = '開始';
            swStartBtn.classList.remove('stop-btn');
            swLapBtn.disabled = true;
            swResetBtn.disabled = true;
            swLapList.innerHTML = '';
        });

        // --- 5. 無間斷蜂鳴器 & 解鎖 AudioContext 控制 ---
        let alertBeepInterval = null;
        const modalOverlay = document.getElementById('alertModal');
        const modalMessage = document.getElementById('modalMessage');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        function startContinuousBeep() {
            stopContinuousBeep();
            initAudioContext();

            function playBeep() {
                try {
                    if (!globalAudioCtx) return;
                    const osc = globalAudioCtx.createOscillator();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, globalAudioCtx.currentTime);
                    osc.connect(globalAudioCtx.destination);
                    osc.start();
                    osc.stop(globalAudioCtx.currentTime + 0.3);
                } catch (e) {
                    console.log('無法播放音效:', e);
                }
            }

            playBeep();
            alertBeepInterval = setInterval(playBeep, 500);
        }

        function stopContinuousBeep() {
            if (alertBeepInterval) {
                clearInterval(alertBeepInterval);
                alertBeepInterval = null;
            }
        }

        function showModalAlert(msg) {
            modalMessage.textContent = msg;
            modalOverlay.classList.add('active');
            startContinuousBeep();
        }

        modalCloseBtn.addEventListener('click', () => {
            modalOverlay.classList.remove('active');
            stopContinuousBeep();
        });

        // 啟動主時鐘
        requestAnimationFrame(updateClock);
    </script>
</body>
</html>
